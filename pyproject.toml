[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retentionlab"
version = "2.0.0"
description = "Customer Retention Intelligence, Churn Prediction & Revenue Prioritization Platform"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "SAIYAMgade" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
